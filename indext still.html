<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Still Life Coding</title>
    <style>
        main {
            border: 1px solid black;
            width: 90vw;
            height: 90vh;
            background-color: antiquewhite;
            position: relative;
        }
        

        #flowers-container {
            
            width: 200px;
            height: 350px;
            position: absolute;
            bottom: 50px;
            left: 40%;
            z-index: 20;
        }
        #vase {
            width: 200px;
            height: 350px;
            background-color: rgb(163, 148, 148);
            position: absolute;
            bottom: 0px;
            left: 0%;
            opacity: 0.5;
            z-index: 20;
            border-radius: 10%;
        }
        .flower{
            position: absolute;
            top:-200px;
            left: 100px;
            width: 200px;
            height: 200px;
            background-color: rgb(255, 219, 15);
            clip-path: polygon(45% 33%, 78% 36%, 100% 44%, 84% 80%, 
            56% 91%, 31% 89%, 12% 77%, 0 40%, 17% 35%);
            z-index: 30;
        }
        .stem{
            clip-path: polygon(63% 0, 70% 0, 44% 99%, 37% 100%);
            width: 200px;
            height: 400px;
            background: #273015;
            background: linear-gradient(0deg,rgba(39, 48, 21, 1) 0%, 
            rgba(135, 153, 57, 1) 30%, rgba(172, 179, 112, 1) 60%);
            position: absolute;
            top: -50px;
            left: 40px;
            z-index: 10;
            
        }
        #bottle {
            clip-path: polygon(36% 100%, 35% 65%, 
            42% 40%, 43% 15%, 40% 11%, 41% 5%, 53% 4%, 
            54% 10%, 52% 15%, 52% 39%, 58% 65%, 58% 100%);
            width: 400px;
            height: 350px;
            opacity: 0.5;
            border-radius: 10px;
            background: #020024;
            background: linear-gradient(90deg,rgba(2, 0, 36, 1) 0%,
             rgba(9, 9, 121, 1) 35%, rgba(93, 158, 168, 1) 100%);
            position: absolute;
            bottom: 50px;
            left: 50%;
            z-index: 10;
        }
        #pineapple {
            clip-path: polygon(41% 95%, 25% 89%, 16% 78%, 14% 64%, 
            14% 54%, 18% 47%, 14% 37%, 20% 28%, 24% 19%, 31% 9%, 42% 6%, 
            53% 7%, 63% 11%, 71% 19%, 76% 30%, 82% 35%, 79% 44%, 84% 54%, 82% 64%, 
            82% 75%, 76% 88%, 61% 98%);
            width: 400px;
            height: 400px;
            background: #608022;
            background: linear-gradient(0deg,rgba(96, 128, 34, 1) 0%,
             rgba(154, 179, 73, 1) 60%, rgba(253, 187, 45, 1) 100%);
            position: absolute;
            bottom: 50px;
            left: 10%;
            z-index: 10;
        }
        .spine {
            clip-path: polygon(20% 100%, 23% 54%, 45% 18%, 62% 9%, 76% 5%, 
            53% 32%, 49% 52%, 49% 68%, 58% 60%, 68% 54%, 80% 57%, 63% 66%, 
            47% 81%, 45% 96%, 44% 100%);
            width: 200px;
            height: 200px;
            background: #273015;
            background: linear-gradient(0deg,rgba(39, 48, 21, 1) 0%, 
            rgba(135, 153, 57, 1) 30%, rgba(172, 179, 112, 1) 60%);
            position: absolute;
            top: -60%;
            left: -120%;
            z-index: 30;
    
        }
        #table {
            width: 100%;
            height: 100px;
            background-color: lightgrey;
            position:absolute;
            bottom: 0;
        }
    </style>
</head>
<body>
    <main>
        <div id="flowers-container">
            <div id="vase"></div>
            <div class="spine"></div>
            <div class="flower"></div>
            <div class="stem"></div>
        </div>

        <div  id="bottle"></div>
        <div id="pineapple"></div>
        
    

        <div class="apple"></div>
        <div id="table"></div>
    </main>

</body>
</html>
